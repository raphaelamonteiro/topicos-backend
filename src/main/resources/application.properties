spring.application.name=topicos

## Logging
# Show sql statement
logging.level.org.hibernate.SQL=debug

## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOSTNAME:db}:5432/topicos
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# URL que o NAVEGADOR usa (issuer que vem dentro do token) — validação do "iss"
app.keycloak.issuer-uri=http://localhost:9080/realms/demo
# URL que o BACKEND usa internamente, via rede Docker, para buscar as chaves públicas
app.keycloak.jwk-set-uri=http://${KEYCLOAK_HOST:keycloak}:9080/realms/demo/protocol/openid-connect/certs
app.cors.allowed-origins=http://localhost:5173
